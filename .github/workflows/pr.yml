name: Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/osc135/financial-budget-backend
  FRONTEND_IMAGE: ghcr.io/osc135/financial-budget-frontend

jobs:
  lint-helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Lint Helm chart
        run: helm lint ./chart

  build-and-push-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-version:
    runs-on: ubuntu-latest
    needs: [lint-helm, build-and-push-backend, build-and-push-frontend]
    if: github.event.action == 'opened'
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump chart version
        run: |
          CURRENT_VERSION=$(grep "^version:" chart/Chart.yaml | sed 's/version: //')
          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="$MAJOR.$NEW_MINOR.0"
          sed -i "s/^version: .*/version: $NEW_VERSION/" chart/Chart.yaml
          echo "Bumped version: $CURRENT_VERSION -> $NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Update appVersion
        run: |
          sed -i 's/^appVersion: ".*"/appVersion: "${{ github.sha }}"/' chart/Chart.yaml

      - name: Install yq
        uses: mikefarah/yq@v4.42.1

      - name: Update image tags in values.yaml
        run: |
          yq e '.backend.image.tag = "${{ github.sha }}"' -i chart/values.yaml
          yq e '.frontend.image.tag = "${{ github.sha }}"' -i chart/values.yaml

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chart/Chart.yaml chart/values.yaml
          git commit -m "Bump chart version to $NEW_VERSION and update image tags for PR #${{ github.event.number }}" || echo "No changes to commit"
          git push origin ${{ github.head_ref }}

  create-replicated-release:
    runs-on: ubuntu-latest
    needs: [lint-helm, build-and-push-backend, build-and-push-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install yq
        uses: mikefarah/yq@v4.42.1

      - name: Get chart version
        id: chart-version
        run: |
          VERSION=$(grep "^version:" chart/Chart.yaml | sed 's/version: //')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Chart version: $VERSION"

      - name: Sync chartVersion into kots-helmchart.yaml
        run: |
          yq e ".spec.chart.chartVersion = \"${{ steps.chart-version.outputs.version }}\"" -i replicated/kots-helmchart.yaml
          echo "Updated kots-helmchart.yaml:"
          grep -A1 "chart:" replicated/kots-helmchart.yaml | head -5

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Package Helm chart into release dir
        run: |
          helm package ./chart -d ./replicated
          ls -la ./replicated

      - name: Create Replicated release
        id: create-release
        uses: replicatedhq/replicated-actions/create-release@v1
        with:
          app-slug: financial-budget
          api-token: ${{ secrets.REPLICATED_FINANCIAL_BUDGET }}
          yaml-dir: ./replicated

      - name: Verify release exists
        run: |
          echo "Created release sequence: ${{ steps.create-release.outputs.release-sequence }}"
          echo "Release created successfully"
