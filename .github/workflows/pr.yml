name: Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/osc135/financial-budget-backend
  FRONTEND_IMAGE: ghcr.io/osc135/financial-budget-frontend

jobs:
  lint-helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Lint Helm chart
        run: helm lint ./chart

      - name: Validate values.schema.json
        run: helm schema-gen ./chart 2>/dev/null || echo "schema-gen not available, skipping"

  build-and-push-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-replicated-release:
    runs-on: ubuntu-latest
    needs: [lint-helm, build-and-push-backend, build-and-push-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Replicated CLI
        run: |
          curl -s https://api.github.com/repos/replicatedhq/replicated/releases/latest | \
            grep "browser_download_url.*linux_amd64.tar.gz" | \
            cut -d : -f 2,3 | \
            tr -d \" | \
            wget -O replicated.tar.gz -qi -
          tar xf replicated.tar.gz replicated
          chmod +x replicated
          sudo mv replicated /usr/local/bin/

      - name: Update image tags in values.yaml
        run: |
          sed -i 's|tag: redis-cache|tag: ${{ github.sha }}|' chart/values.yaml
          sed -i 's|tag: latest|tag: ${{ github.sha }}|' chart/values.yaml

      - name: Create Replicated release
        env:
          REPLICATED_API_TOKEN: ${{ secrets.REPLICATED_API_TOKEN }}
          REPLICATED_APP: financial-budget
        run: |
          replicated release create \
            --yaml-dir ./chart \
            --version "pr-${{ github.event.number }}-${{ github.sha }}"

      - name: Verify release exists
        env:
          REPLICATED_API_TOKEN: ${{ secrets.REPLICATED_API_TOKEN }}
          REPLICATED_APP: financial-budget
        run: |
          replicated release ls | head -5
