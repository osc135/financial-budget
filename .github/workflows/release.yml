name: Release

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/osc135/financial-budget-backend
  FRONTEND_IMAGE: ghcr.io/osc135/financial-budget-frontend

jobs:
  lint-helm:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Lint Helm chart
        run: helm lint ./chart

  build-and-push-backend:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-frontend:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-version-and-promote:
    runs-on: ubuntu-latest
    needs: [lint-helm, build-and-push-backend, build-and-push-frontend]
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump chart version
        run: |
          CURRENT_VERSION=$(grep "^version:" chart/Chart.yaml | sed 's/version: //')
          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
          PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="$MAJOR.$NEW_MINOR.0"
          sed -i "s/^version: .*/version: $NEW_VERSION/" chart/Chart.yaml
          echo "Bumped version: $CURRENT_VERSION -> $NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Update appVersion
        run: |
          sed -i 's/^appVersion: ".*"/appVersion: "${{ github.sha }}"/' chart/Chart.yaml

      - name: Update image tags in values.yaml
        run: |
          sed -i 's|tag: redis-cache|tag: ${{ github.sha }}|' chart/values.yaml
          sed -i 's|tag: latest|tag: ${{ github.sha }}|' chart/values.yaml

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chart/Chart.yaml chart/values.yaml
          git commit -m "Bump chart version to ${{ env.NEW_VERSION }} and update image tags [ci skip]" || echo "No changes to commit"

      - name: Push version bump
        run: |
          git push origin main

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Package Helm chart
        id: package
        run: |
          helm package ./chart
          CHART_FILE=$(ls financial-budget-*.tgz | head -1)
          echo "chart-file=$CHART_FILE" >> $GITHUB_OUTPUT
          echo "Packaged: $CHART_FILE"

      - name: Create Replicated release
        id: create-release
        uses: replicatedhq/replicated-actions/create-release@v1
        with:
          app-slug: financial-budget
          api-token: ${{ secrets.REPLICATED_FINANCIAL_BUDGET }}
          chart: ./${{ steps.package.outputs.chart-file }}

      - name: Promote to Unstable
        uses: replicatedhq/replicated-actions/promote-release@v1
        with:
          app-slug: financial-budget
          api-token: ${{ secrets.REPLICATED_FINANCIAL_BUDGET }}
          channel-to: Unstable
          release-sequence: ${{ steps.create-release.outputs.release-sequence }}
          release-version: ${{ env.NEW_VERSION }}
