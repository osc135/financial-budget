name: Release

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/osc135/financial-budget-backend
  FRONTEND_IMAGE: ghcr.io/osc135/financial-budget-frontend

jobs:
  lint-helm:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Lint Helm chart
        run: helm lint ./chart

  build-and-push-backend:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: read
      packages: write
      id-token: write  # required for cosign keyless OIDC signing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push backend image
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign backend image (keyless)
        env:
          DIGEST: ${{ steps.build-backend.outputs.digest }}
        run: cosign sign --yes ${{ env.BACKEND_IMAGE }}@${DIGEST}

  build-and-push-frontend:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: read
      packages: write
      id-token: write  # required for cosign keyless OIDC signing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push frontend image
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign frontend image (keyless)
        env:
          DIGEST: ${{ steps.build-frontend.outputs.digest }}
        run: cosign sign --yes ${{ env.FRONTEND_IMAGE }}@${DIGEST}

  package-and-promote:
    runs-on: ubuntu-latest
    needs: [lint-helm, build-and-push-backend, build-and-push-frontend]
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update appVersion
        run: |
          sed -i 's/appVersion: ".*"/appVersion: "${{ github.sha }}"/' chart/Chart.yaml

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.42.1/yq_linux_amd64
          chmod +x /usr/local/bin/yq
          yq --version

      - name: Update image tags in values.yaml
        run: |
          yq e '.backend.image.tag = "${{ github.sha }}"' -i chart/values.yaml
          yq e '.frontend.image.tag = "${{ github.sha }}"' -i chart/values.yaml

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Get chart version
        id: chart-version
        run: |
          VERSION=$(grep "^version:" chart/Chart.yaml | sed 's/version: //')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Chart version: $VERSION"

      - name: Sync chartVersion into kots-helmchart.yaml
        run: |
          yq e ".spec.chart.chartVersion = \"${{ steps.chart-version.outputs.version }}\"" -i replicated/kots-helmchart.yaml
          echo "Updated kots-helmchart.yaml:"
          grep -A1 "chart:" replicated/kots-helmchart.yaml | head -5

      - name: Package Helm chart into release dir
        run: |
          helm package ./chart -d ./replicated
          ls -la ./replicated

      - name: Create Replicated release
        id: create-release
        uses: replicatedhq/replicated-actions/create-release@v1
        with:
          app-slug: financial-budget
          api-token: ${{ secrets.REPLICATED_FINANCIAL_BUDGET }}
          yaml-dir: ./replicated

      - name: Install Replicated CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo replicatedhq/replicated --pattern '*linux_amd64.tar.gz' --dir /tmp
          tar xf /tmp/replicated_*_linux_amd64.tar.gz -C /tmp replicated
          chmod +x /tmp/replicated
          sudo mv /tmp/replicated /usr/local/bin/replicated

      - name: Promote to Unstable
        env:
          REPLICATED_API_TOKEN: ${{ secrets.REPLICATED_FINANCIAL_BUDGET }}
          REPLICATED_APP: financial-budget
        run: |
          replicated release promote ${{ steps.create-release.outputs.release-sequence }} Unstable
