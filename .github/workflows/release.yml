name: Release

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/osc135/financial-budget-backend
  FRONTEND_IMAGE: ghcr.io/osc135/financial-budget-frontend

jobs:
  lint-helm:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Lint Helm chart
        run: helm lint ./chart

  build-and-push-backend:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-frontend:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package-and-promote:
    runs-on: ubuntu-latest
    needs: [lint-helm, build-and-push-backend, build-and-push-frontend]
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Package Helm chart
        id: package
        run: |
          helm package ./chart
          CHART_FILE=$(ls financial-budget-*.tgz | head -1)
          echo "chart-file=$CHART_FILE" >> $GITHUB_OUTPUT
          echo "Packaged: $CHART_FILE"

      - name: Get chart version
        id: chart-version
        run: |
          VERSION=$(grep "^version:" chart/Chart.yaml | sed 's/version: //')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Chart version: $VERSION"

      - name: Create Replicated release
        id: create-release
        uses: replicatedhq/replicated-actions/create-release@v1
        with:
          app-slug: financial-budget
          api-token: ${{ secrets.REPLICATED_FINANCIAL_BUDGET }}
          chart: ./${{ steps.package.outputs.chart-file }}

      - name: Install Replicated CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo replicatedhq/replicated --pattern '*linux_amd64.tar.gz' --dir /tmp
          tar xf /tmp/replicated_*_linux_amd64.tar.gz -C /tmp replicated
          chmod +x /tmp/replicated
          sudo mv /tmp/replicated /usr/local/bin/replicated

      - name: Promote to Unstable
        env:
          REPLICATED_API_TOKEN: ${{ secrets.REPLICATED_FINANCIAL_BUDGET }}
          REPLICATED_APP: financial-budget
        run: |
          replicated release promote ${{ steps.create-release.outputs.release-sequence }} Unstable
