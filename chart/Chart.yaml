apiVersion: v2
name: financial-budget
description: A Helm chart for Financial Budget
version: 0.74.0
appVersion: "ed694f220b81e044d6adb3f1a5b4021d287c5615"
dependencies:
  - name: postgresql
    version: 15.5.0
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 19.6.0
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: replicated
    alias: financial-budget-sdk
    version: 1.19.3
    repository: oci://registry.replicated.com/library
  - name: ingress-nginx
    version: 4.11.3
    repository: https://kubernetes.github.io/ingress-nginx
    condition: ingress-nginx.enabled
