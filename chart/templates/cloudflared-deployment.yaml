{{- if .Values.cloudflared.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "financial-budget.fullname" . }}-cloudflared
  labels:
    {{- include "financial-budget.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "financial-budget.fullname" . }}-cloudflared
                  key: tunnel-token
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "financial-budget.fullname" . }}-cloudflared
  labels:
    {{- include "financial-budget.labels" . | nindent 4 }}
type: Opaque
stringData:
  tunnel-token: {{ .Values.cloudflared.tunnelToken }}
{{- end }}
