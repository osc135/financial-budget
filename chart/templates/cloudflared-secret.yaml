{{- if and .Values.cloudflared.enabled .Values.cloudflared.tunnelToken }}
apiVersion: v1
kind: Secret
metadata:
  name: financial-budget-cloudflared
  labels:
    {{- include "financial-budget.labels" . | nindent 4 }}
type: Opaque
stringData:
  tunnel-token: {{ .Values.cloudflared.tunnelToken | quote }}
{{- end }}
