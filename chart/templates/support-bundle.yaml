apiVersion: v1
kind: Secret
metadata:
  name: financial-budget-support-bundle
  labels:
    {{- include "financial-budget.labels" . | nindent 4 }}
    troubleshoot.sh/kind: support-bundle
stringData:
  support-bundle-spec: |
    apiVersion: troubleshoot.sh/v1beta2
    kind: SupportBundle
    metadata:
      name: financial-budget-support-bundle
    spec:
      collectors:
        # 1. Backend logs
        - logs:
            selector:
              - app.kubernetes.io/component=backend
            namespace: {{ .Release.Namespace }}
            limits:
              maxLines: 10000

        # 2. Frontend logs
        - logs:
            selector:
              - app.kubernetes.io/component=frontend
            namespace: {{ .Release.Namespace }}
            limits:
              maxLines: 10000

        # 3. Cloudflared logs
        - logs:
            selector:
              - app.kubernetes.io/component=cloudflared
            namespace: {{ .Release.Namespace }}
            limits:
              maxLines: 10000

        # 4. PostgreSQL logs (Bitnami uses component=primary)
        - logs:
            selector:
              - app.kubernetes.io/component=primary
              - app.kubernetes.io/name=postgresql
            namespace: {{ .Release.Namespace }}
            limits:
              maxLines: 10000

        # 5. Redis logs (Bitnami uses component=master)
        - logs:
            selector:
              - app.kubernetes.io/component=master
              - app.kubernetes.io/name=redis
            namespace: {{ .Release.Namespace }}
            limits:
              maxLines: 10000

        # 6. Replicated SDK logs
        - logs:
            selector:
              - app.kubernetes.io/name=financial-budget-sdk
            namespace: {{ .Release.Namespace }}
            limits:
              maxLines: 10000

        # 7. Backend health endpoint
        - http:
            collectorName: backend-health
            get:
              url: http://backend.{{ .Release.Namespace }}.svc.cluster.local:8000/health
              insecureSkipVerify: false

      analyzers:
        # 3.3: Backend health endpoint analyzer
        - textAnalyze:
            checkName: Backend Health Endpoint
            fileName: backend-health.json
            regex: '"status": "ok"'
            outcomes:
              - fail:
                  when: "false"
                  message: "Backend health check failed. The API is not responding with a healthy status. Users cannot log in or access budget data. Check that the backend pod is Running and the database is accessible."
              - pass:
                  message: "Backend health endpoint returns status 'ok'. The API is serving requests normally."

        # 3.4: Deployment and StatefulSet status analyzers
        - deploymentStatus:
            checkName: Backend Deployment Ready
            namespace: {{ .Release.Namespace }}
            name: {{ include "financial-budget.fullname" . }}-backend
            outcomes:
              - fail:
                  when: "absent"
                  message: "Backend deployment is missing. The API cannot serve requests and users cannot log in or access budget data."
              - fail:
                  when: "< 1"
                  message: "Backend deployment has no ready replicas. Check backend pod logs for crashes or database connection failures."
              - pass:
                  message: "Backend deployment is healthy with ready replicas."

        - deploymentStatus:
            checkName: Frontend Deployment Ready
            namespace: {{ .Release.Namespace }}
            name: {{ include "financial-budget.fullname" . }}-frontend
            outcomes:
              - fail:
                  when: "absent"
                  message: "Frontend deployment is missing. Users cannot access the web UI."
              - fail:
                  when: "< 1"
                  message: "Frontend deployment has no ready replicas. The web UI is unavailable. Check frontend pod logs."
              - pass:
                  message: "Frontend deployment is healthy with ready replicas."

        - deploymentStatus:
            checkName: Cloudflared Tunnel Ready
            namespace: {{ .Release.Namespace }}
            name: {{ include "financial-budget.fullname" . }}-cloudflared
            outcomes:
              - fail:
                  when: "absent"
                  message: "Cloudflared deployment is missing. The secure tunnel to the internet is down. Users cannot access the app via the custom domain."
              - fail:
                  when: "< 1"
                  message: "Cloudflared has no ready replicas. External access via tunnel is unavailable. Check cloudflared pod logs for token or connectivity issues."
              - pass:
                  message: "Cloudflared tunnel is healthy with ready replicas."

        - statefulsetStatus:
            checkName: PostgreSQL StatefulSet Ready
            namespace: {{ .Release.Namespace }}
            name: {{ include "financial-budget.fullname" . }}-postgresql
            outcomes:
              - fail:
                  when: "absent"
                  message: "PostgreSQL StatefulSet is missing. All persistent data storage is unavailable. The app cannot read or write budget data."
              - fail:
                  when: "< 1"
                  message: "PostgreSQL has no ready replicas. Database is down. Check PVC binding and postgresql pod logs."
              - pass:
                  message: "PostgreSQL StatefulSet is healthy with ready replicas."

        - statefulsetStatus:
            checkName: Redis StatefulSet Ready
            namespace: {{ .Release.Namespace }}
            name: {{ include "financial-budget.fullname" . }}-redis-master
            outcomes:
              - fail:
                  when: "absent"
                  message: "Redis StatefulSet is missing. Session cache and rate limiting are unavailable. Users may experience login issues or degraded performance."
              - fail:
                  when: "< 1"
                  message: "Redis has no ready replicas. Cache layer is down. Check redis pod logs and PVC status."
              - pass:
                  message: "Redis StatefulSet is healthy with ready replicas."

        - deploymentStatus:
            checkName: Replicated SDK Deployment Ready
            namespace: {{ .Release.Namespace }}
            name: {{ include "financial-budget.fullname" . }}-sdk
            outcomes:
              - fail:
                  when: "absent"
                  message: "Replicated SDK deployment is missing. License validation, metrics, and update checks are unavailable. The app cannot verify entitlements."
              - fail:
                  when: "< 1"
                  message: "Replicated SDK has no ready replicas. License enforcement and vendor portal sync are down. Check sdk pod logs."
              - pass:
                  message: "Replicated SDK deployment is healthy with ready replicas."

        # 3.5: App-specific budget data corruption analyzer
        - textAnalyze:
            checkName: Invalid Budget Income Data
            fileName: "*/backend.log"
            regex: 'Invalid budget data: monthly income is'
            outcomes:
              - fail:
                  when: "true"
                  message: "Corrupted budget data detected: a budget record has zero or negative monthly income. This breaks the 50/30/20 rule calculations. This typically indicates data corruption or a direct database mutation that bypassed API validation. Check the backend logs for the specific user ID, then inspect the budgets table in PostgreSQL for invalid records."
              - pass:
                  message: "No corrupted budget income data detected. All budget records have valid positive monthly income values."


