backend:
  image:
    repository: proxy.budget-helping.com/proxy/financial-budget/ghcr2.io/osc135/financial-budget-backend
    tag: a187973523a78294a8ebbb55fd79902f1f64db05
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  livenessProbe:
    enabled: true
    path: /health
    port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    enabled: true
    path: /health
    port: 8000
    initialDelaySeconds: 5
    periodSeconds: 5
frontend:
  image:
    repository: proxy.budget-helping.com/proxy/financial-budget/ghcr2.io/osc135/financial-budget-frontend
    tag: a187973523a78294a8ebbb55fd79902f1f64db05
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  livenessProbe:
    enabled: true
    path: /
    port: 80
    initialDelaySeconds: 10
    periodSeconds: 10
  readinessProbe:
    enabled: true
    path: /
    port: 80
    initialDelaySeconds: 5
    periodSeconds: 5
database:
  embedded:
    enabled: true
  external:
    host: ""
    port: 5432
    username: ""
    password: ""
    database: ""
postgresql:
  enabled: true
  image:
    registry: proxy.budget-helping.com/proxy/financial-budget/index.docker.io
    repository: bitnami/postgresql
    tag: latest
  auth:
    username: budgetuser
    password: budgetpass
    database: budgetdb
  primary:
    persistence:
      enabled: true
      size: 1Gi
redis:
  enabled: true
  architecture: standalone
  image:
    registry: proxy.budget-helping.com/proxy/financial-budget/index.docker.io
    repository: bitnami/redis
    tag: latest
  auth:
    enabled: false
tls:
  enabled: true
  existingSecret: ""
  auto: false
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: app.budget-helping.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ""
      hosts:
        - app.budget-helping.com
cloudflared:
  enabled: true
  tunnelToken: ""
ingress-nginx:
  # Disabled by default — Helm dev installs typically have their own ingress
  # controller. Enabled via KOTS HelmChart override for Embedded Cluster
  # installs so the VM gets a working ingress controller out of the box.
  enabled: false
  controller:
    service:
      type: NodePort
      nodePorts:
        http: "80"
        https: "443"
imagePullSecrets:
  - name: enterprise-pull-secret
global:
  imagePullSecrets:
    - name: enterprise-pull-secret
service:
  type: ClusterIP
