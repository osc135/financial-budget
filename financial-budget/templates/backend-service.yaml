apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    {{- include "financial-budget.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "financial-budget.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
