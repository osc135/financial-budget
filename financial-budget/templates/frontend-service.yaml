apiVersion: v1
kind: Service
metadata:
  name: {{ include "financial-budget.fullname" . }}-frontend
  labels:
    {{- include "financial-budget.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
    - port: 443
      targetPort: https
      protocol: TCP
      name: https
  selector:
    {{- include "financial-budget.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
