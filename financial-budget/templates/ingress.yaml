{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "financial-budget.fullname" . }}
  labels:
    {{- include "financial-budget.labels" . | nindent 4 }}
    {{- if or .Values.ingress.annotations .Values.tls.auto .Values.tls.enabled }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.tls.auto }}
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    {{- end }}
    {{- if .Values.tls.enabled }}
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "financial-budget.fullname" $ }}-frontend
                port:
                  number: 80
          {{- end }}
    {{- end }}
  {{- if .Values.tls.enabled }}
  tls:
    - hosts:
        {{- range .Values.ingress.hosts }}
        - {{ .host | quote }}
        {{- end }}
      secretName: {{ if .Values.tls.auto }}{{ include "financial-budget.fullname" . }}-tls-auto{{ else if .Values.tls.existingSecret }}{{ .Values.tls.existingSecret }}{{ else }}{{ include "financial-budget.fullname" . }}-tls{{ end }}
  {{- end }}
{{- end }}
