apiVersion: embeddedcluster.replicated.com/v1beta1
kind: Config
metadata:
  name: financial-budget-ec
spec:
  version: "3.0.0-beta.4+k8s-1.34"
  domains:
    proxyRegistryDomain: proxy.budget-helping.com
  extensions:
    helmCharts:
      - chart:
          name: ingress-nginx
          chartVersion: "4.11.3"
        releaseName: ingress-nginx
        namespace: ingress-nginx
        values: |
          controller:
            service:
              type: NodePort
              nodePorts:
                http: "80"
                https: "443"
