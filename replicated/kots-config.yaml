apiVersion: kots.io/v1beta1
kind: Config
metadata:
  name: financial-budget-config
spec:
  groups:
    # Auto-generated secrets. All items hidden, so the whole group is
    # invisible in the config screen. Defaults using RandomString are
    # evaluated once on first install and persisted by KOTS, so the
    # generated values survive upgrades.
    - name: secrets
      title: Secrets
      items:
        - name: embedded_db_password
          title: Embedded Database Password
          type: password
          hidden: true
          default: '{{repl RandomString 32}}'

    - name: cloudflare
      title: Cloudflare Tunnel
      description: |
        Optional Cloudflare tunnel for exposing the app externally.
        Leave disabled to use the cluster's ingress controller instead.
      items:
        - name: enable_cloudflared
          title: Enable Cloudflare Tunnel
          help_text: |
            Toggle on to deploy the Cloudflare tunnel pod. You'll need
            a tunnel token from the Cloudflare Zero Trust dashboard.
          type: bool
          default: "0"
        - name: tunnel_token
          title: Cloudflare Tunnel Token
          help_text: |
            From the Cloudflare Zero Trust dashboard, copy the tunnel
            token for the tunnel you want this app to use. Stored as
            a Kubernetes Secret.
          type: password
          required: true
          when: '{{repl ConfigOptionEquals "enable_cloudflared" "1"}}'

    # Premium-tier feature: only shown when the customer's license has
    # `external_db_enabled: true`. KOTS hides the entire group from the
    # config screen when the LicenseFieldValue evaluates to false.
    - name: database
      title: Database
      description: |
        Connect to an external PostgreSQL instance instead of the
        bundled in-cluster database. Available on Premium licenses.
      when: '{{repl LicenseFieldValue "external_db_enabled" | ParseBool}}'
      items:
        - name: database_mode
          title: Database Mode
          help_text: |
            Use the embedded PostgreSQL deployed alongside the app,
            or point the app at your own external PostgreSQL.
          type: radio
          default: embedded
          items:
            - name: embedded
              title: Use embedded PostgreSQL
            - name: external
              title: Use external PostgreSQL
        - name: external_db_host
          title: Host
          help_text: Hostname or IP of your external PostgreSQL server.
          type: text
          required: true
          when: '{{repl ConfigOptionEquals "database_mode" "external"}}'
        - name: external_db_port
          title: Port
          help_text: PostgreSQL port. Defaults to 5432.
          type: text
          default: "5432"
          when: '{{repl ConfigOptionEquals "database_mode" "external"}}'
        - name: external_db_name
          title: Database Name
          help_text: Name of the database to connect to.
          type: text
          required: true
          when: '{{repl ConfigOptionEquals "database_mode" "external"}}'
        - name: external_db_username
          title: Username
          help_text: Username for the external PostgreSQL connection.
          type: text
          required: true
          when: '{{repl ConfigOptionEquals "database_mode" "external"}}'
        - name: external_db_password
          title: Password
          help_text: Password for the external PostgreSQL connection.
          type: password
          required: true
          when: '{{repl ConfigOptionEquals "database_mode" "external"}}'
