apiVersion: kots.io/v1beta2
kind: HelmChart
metadata:
  name: financial-budget
spec:
  chart:
    name: financial-budget
    chartVersion: "0.0.0-placeholder"  # CI replaces this with the real chart version
  releaseName: financial-budget
  namespace: default
  # builder tells KOTS the canonical source for each image at airgap build
  # time. KOTS merges these on top of chart/values.yaml, so we only override
  # registry/repository — the tag stays in values.yaml where CI maintains it.
  # Without this, KOTS sees the proxy.budget-helping.com URLs in values.yaml
  # and can't rewrite them to the in-cluster registry on airgap install.
  builder:
    backend:
      image:
        repository: ghcr.io/osc135/financial-budget-backend
    frontend:
      image:
        repository: ghcr.io/osc135/financial-budget-frontend
    postgresql:
      image:
        registry: docker.io
    redis:
      image:
        registry: docker.io
    # ingress-nginx's admission Job uses kube-webhook-certgen to generate
    # TLS certs for the validating webhook. KOTS auto-discovery missed it,
    # which broke airgap installs (ImagePullBackOff on the pre-install hook).
    ingress-nginx:
      controller:
        admissionWebhooks:
          patch:
            image:
              registry: registry.k8s.io
              image: ingress-nginx/kube-webhook-certgen
              tag: v1.4.4
  values:
    # ingress-nginx is bundled as a subchart. Off by default (so Helm dev
    # installs don't get a duplicate ingress controller) and turned on here
    # for Embedded Cluster installs so the VM has a working ingress
    # controller for serving the app.
    ingress-nginx:
      enabled: true
    # Embedded PostgreSQL password is generated once by KOTS on first
    # install (RandomString default on the `embedded_db_password` config
    # item) and reused on every upgrade, so the value injected into the
    # postgresql subchart and the backend's DATABASE_URL stays stable
    # across upgrades. Overrides the static placeholder in chart/values.yaml.
    postgresql:
      auth:
        password: '{{repl ConfigOption "embedded_db_password"}}'
  optionalValues:
    - when: '{{repl ConfigOptionEquals "enable_cloudflared" "1"}}'
      recursiveMerge: true
      values:
        cloudflared:
          enabled: true
          tunnelToken: '{{repl ConfigOption "tunnel_token"}}'
    - when: '{{repl ConfigOptionEquals "enable_cloudflared" "0"}}'
      recursiveMerge: true
      values:
        cloudflared:
          enabled: false
    # When the customer chooses external PostgreSQL on the config screen,
    # disable the bundled subchart and route the app at their database.
    # Gated upstream by the LicenseFieldValue on the Database config group,
    # so customers without the entitlement never see these options.
    - when: '{{repl ConfigOptionEquals "database_mode" "external"}}'
      recursiveMerge: true
      values:
        database:
          embedded:
            enabled: false
          external:
            host: '{{repl ConfigOption "external_db_host"}}'
            port: '{{repl ConfigOption "external_db_port"}}'
            database: '{{repl ConfigOption "external_db_name"}}'
            username: '{{repl ConfigOption "external_db_username"}}'
            password: '{{repl ConfigOption "external_db_password"}}'
        postgresql:
          enabled: false
