apiVersion: kots.io/v1beta2
kind: HelmChart
metadata:
  name: financial-budget
spec:
  chart:
    name: financial-budget
    chartVersion: "0.0.0-placeholder"  # CI replaces this with the real chart version
  releaseName: financial-budget
  namespace: default
  values:
    # ingress-nginx is bundled as a subchart. Off by default (so Helm dev
    # installs don't get a duplicate ingress controller) and turned on here
    # for Embedded Cluster installs so the VM has a working ingress
    # controller for serving the app.
    ingress-nginx:
      enabled: true
  optionalValues:
    - when: '{{repl ConfigOptionEquals "enable_cloudflared" "1"}}'
      recursiveMerge: true
      values:
        cloudflared:
          enabled: true
          tunnelToken: '{{repl ConfigOption "tunnel_token"}}'
    - when: '{{repl ConfigOptionEquals "enable_cloudflared" "0"}}'
      recursiveMerge: true
      values:
        cloudflared:
          enabled: false
